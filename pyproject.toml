readme = "README.md"
authors = [
    { name = "Shekhrozx", email = "shekhrozx@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "advanced-alchemy[pwdlib,uuid]>=1.11.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "httpx-oauth>=0.17.0",
    "litestar-granian[uvloop]>=0.16.0",
    "litestar[cryptography,jwt,pydantic,redis,standard,structlog]>=2.24.0",
